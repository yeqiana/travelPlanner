# 当前项目默认启用开发环境配置。
spring:
  profiles:
    active: dev
  application:
    name: travel-planner
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

logging:
  level:
    org.springframework: WARN
    com.yeqian.travelagent: INFO

springdoc:
  api-docs:
    # OpenAPI JSON 文档地址。
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI 页面地址。
    path: /swagger-ui.html
    # 按 Controller 方法声明顺序展示接口，便于联调查看。
    operations-sorter: method
    # 按标签名称排序接口分组。
    tags-sorter: alpha
  # 只扫描对外 API Controller，避免把内部类误暴露成接口文档。
  packages-to-scan: com.yeqian.travelagent.interfaces.controller
  # 只展示对外 API 路径。
  paths-to-match: /api/**

travel-planner:
  trip:
    default-days: 3
    max-days: 30
  ai:
    enabled: false
    base-url: ${TRAVEL_PLANNER_AI_BASE_URL:http://localhost:11434}
    model: ${TRAVEL_PLANNER_AI_MODEL:qwen2.5}

travel-agent:
  planning:
    session-ttl-hours: ${TRAVEL_SESSION_TTL_HOURS:24}
  external-api:
    weather:
      api-key: ${WEATHER_API_KEY:}
      base-url: ${WEATHER_BASE_URL:https://api.openweathermap.org}
      timeout-millis: ${WEATHER_TIMEOUT_MILLIS:3000}
    search:
      api-key: ${SEARCH_API_KEY:}
      base-url: ${SEARCH_BASE_URL:https://api.tavily.com}
      timeout-millis: ${SEARCH_TIMEOUT_MILLIS:5000}
      max-results: ${SEARCH_MAX_RESULTS:5}
    amap:
      api-key: ${AMAP_API_KEY:}
      base-url: ${AMAP_BASE_URL:https://restapi.amap.com}
      timeout-millis: ${AMAP_TIMEOUT_MILLIS:3000}
