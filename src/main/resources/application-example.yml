server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: dev
  application:
    name: travel-planner
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    model:
      audio:
        speech: none
        transcription: none
      chat: openai
      embedding: none
      image: none
      moderation: none
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL}
      chat:
        completions-path: ${OPENAI_COMPATIBLE_COMPLETIONS_PATH}
        options:
          model: ${DEEPSEEK_CHAT_MODEL}
          temperature: ${DEEPSEEK_TEMPERATURE}

logging:
  level:
    org.springframework: WARN
    com.yeqian.travelagent: DEBUG

travel-agent:
  planning:
    # 多轮追问会话过期小时数，默认 24 小时。
    session-ttl-hours: ${TRAVEL_SESSION_TTL_HOURS:24}
  external-api:
    weather:
      api-key: ${WEATHER_API_KEY}
      base-url: ${WEATHER_BASE_URL}
      timeout-millis: ${WEATHER_TIMEOUT_MILLIS}
    search:
      api-key: ${SEARCH_API_KEY}
      base-url: ${SEARCH_BASE_URL}
      timeout-millis: ${SEARCH_TIMEOUT_MILLIS}
      max-results: ${SEARCH_MAX_RESULTS}
    amap:
      api-key: ${AMAP_API_KEY}
      base-url: ${AMAP_BASE_URL}
      timeout-millis: ${AMAP_TIMEOUT_MILLIS}
